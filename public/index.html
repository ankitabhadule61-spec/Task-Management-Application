<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Task Manager App</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet">


<style>

/* =====================================================
   GLOBAL
===================================================== */

:root {

    --bg1: #f8fafc;
    --bg2: #eef2ff;

    --card: #ffffff;

    --border: #cbd5e1;

    --ink: #0f172a;
    --ink-soft: #475569;
    --muted: #64748b;

    /* Primary Indigo */
    --primary: #4f46e5;
    --primary-dark: #3730a3;
    --primary-light: #e0e7ff;

    /* Blue */
    --blue: #1d4ed8;
    --blue-light: #eff6ff;

    /* Orange */
    --orange: #c2410c;
    --orange-light: #fff7ed;

    /* Red */
    --red: #b91c1c;
    --red-light: #fef2f2;

    font-family: 'Inter', sans-serif;
}


* {
    box-sizing: border-box;
}


html,
body {
    height: 100%;
}


body {

    margin: 0;

    min-height: 100vh;

    background:
        linear-gradient(
            160deg,
            var(--bg1),
            var(--bg2)
        );

    color: var(--ink);

    display: flex;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {

    width: 240px;

    flex: none;

    background: #ffffff;

    border-right: 1px solid var(--border);

    padding: 26px 18px;

    display: flex;

    flex-direction: column;

    position: sticky;

    top: 0;

    height: 100vh;
}


.logo {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 0 6px 26px;
}


.logo-mark {

    width: 36px;

    height: 36px;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-dark)
        );

    color: #ffffff;

    display: flex;

    align-items: center;

    justify-content: center;

    font-weight: 800;

    font-size: .82rem;

    font-family: 'Plus Jakarta Sans', sans-serif;

    flex: none;
}


.logo-name {

    font-family: 'Plus Jakarta Sans', sans-serif;

    font-weight: 800;

    font-size: 1.02rem;

    line-height: 1.1;

    color: var(--ink);
}


.logo-tag {

    font-size: .62rem;

    letter-spacing: .09em;

    color: var(--muted);

    font-weight: 700;
}


.side-nav {

    display: flex;

    flex-direction: column;

    gap: 6px;
}


.nav-item {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 11px 14px;

    border-radius: 10px;

    color: var(--ink-soft);

    font-weight: 600;

    font-size: .9rem;

    text-decoration: none;

    border: none;

    background: transparent;

    cursor: pointer;

    width: 100%;

    text-align: left;

    transition:
        background .15s ease,
        color .15s ease;
}


.nav-item svg {

    flex: none;
}


.nav-item:hover {

    background: #f1f5f9;

    color: var(--ink);
}


.nav-item.active {

    background: var(--primary-light);

    color: var(--primary-dark);

    font-weight: 700;
}


.sidebar-spacer {

    flex: 1;
}


.nav-item.logout:hover {

    background: var(--red-light);

    color: var(--red);
}


/* =====================================================
   MAIN
===================================================== */

main {

    flex: 1;

    padding: 42px 55px 60px;

    min-width: 0;
}


/* =====================================================
   HEADER
===================================================== */

.breadcrumb {

    font-size: .86rem;

    color: var(--muted);

    font-weight: 600;

    margin-bottom: 12px;
}


.breadcrumb .current {

    color: var(--primary);

    font-weight: 700;
}


.page-head {

    display: flex;

    align-items: flex-start;

    justify-content: space-between;

    gap: 20px;

    flex-wrap: wrap;

    margin-bottom: 32px;
}


.page-head h1 {

    font-family: 'Plus Jakarta Sans', sans-serif;

    font-weight: 800;

    font-size: 2.25rem;

    margin: 0 0 8px;

    letter-spacing: -.025em;

    color: var(--ink);
}


.page-head p {

    color: var(--ink-soft);

    font-size: 1rem;

    margin: 0;
}


/* =====================================================
   ADD BUTTON
===================================================== */

.btn-add {

    font-size: .92rem;

    font-weight: 700;

    background: var(--primary);

    color: #ffffff;

    border: none;

    border-radius: 12px;

    padding: 14px 22px;

    cursor: pointer;

    text-decoration: none;

    display: inline-flex;

    align-items: center;

    gap: 7px;

    box-shadow:
        0 10px 22px
        rgba(79, 70, 229, .25);

    transition:
        background .15s ease,
        transform .1s ease;
}


.btn-add:hover {

    background: var(--primary-dark);
}


.btn-add:active {

    transform: translateY(1px);
}


/* =====================================================
   ALERT
===================================================== */

#alertBox .alert {

    font-size: .9rem;

    font-weight: 600;

    background: var(--red-light);

    color: var(--red);

    border: 1px solid #fca5a5;

    border-radius: 12px;

    padding: 14px 18px;

    margin-bottom: 24px;
}


/* =====================================================
   TASK GRID
===================================================== */

#taskList {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(380px, 1fr)
        );

    gap: 28px;

    align-items: stretch;
}


/* =====================================================
   TASK CARD
===================================================== */

.task-card {

    background: var(--card);

    border: 1.5px solid var(--border);

    border-radius: 20px;

    padding: 30px;

    min-height: 340px;

    display: flex;

    flex-direction: column;

    box-shadow:
        0 10px 30px
        rgba(15, 23, 42, .04);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;
}


.task-card:hover {

    transform: translateY(-4px);

    border-color: #a5b4fc;

    box-shadow:
        0 18px 40px
        rgba(79, 70, 229, .10);
}


/* =====================================================
   CARD HEADER
===================================================== */

.task-card-head {

    display: flex;

    align-items: flex-start;

    justify-content: space-between;

    gap: 18px;

    margin-bottom: 18px;
}


.task-title {

    font-family: 'Plus Jakarta Sans', sans-serif;

    font-weight: 800;

    font-size: 1.35rem;

    line-height: 1.35;

    margin: 0;

    color: var(--ink);

    word-break: break-word;
}


/* =====================================================
   PILLS
===================================================== */

.pill {

    font-size: .75rem;

    font-weight: 800;

    border-radius: 999px;

    padding: 6px 12px;

    white-space: nowrap;

    border: 1px solid;
}


/* =====================================================
   DESCRIPTION
===================================================== */

.task-desc {

    color: var(--ink-soft);

    font-size: .96rem;

    line-height: 1.7;

    flex-grow: 1;

    margin:
        0
        0
        22px;

    min-height: 75px;

    word-break: break-word;
}


.task-desc strong {

    color: var(--ink);

    font-weight: 700;
}


/* =====================================================
   META
===================================================== */

.task-meta {

    font-size: .88rem;

    color: var(--ink-soft);

    margin:
        0
        0
        16px;

    padding:
        12px
        16px;

    background: #f8fafc;

    border: 1px solid var(--border);

    border-radius: 12px;
}


.task-meta strong {

    color: var(--ink);

    font-weight: 700;
}


/* =====================================================
   STATUS
===================================================== */

.status-line {

    display: inline-flex;

    align-items: center;

    gap: 8px;

    font-size: .88rem;

    font-weight: 700;

    margin-bottom: 20px;
}


.status-line .dot {

    width: 9px;

    height: 9px;

    border-radius: 50%;
}


.status-done {

    color: var(--primary);
}


.status-done .dot {

    background: var(--primary);
}


.status-pending {

    color: var(--orange);
}


.status-pending .dot {

    background: var(--orange);
}


/* =====================================================
   ACTIONS
===================================================== */

.task-actions {

    display: flex;

    gap: 10px;

    margin-top: auto;

    padding-top: 18px;

    border-top:
        1px dashed
        var(--border);
}


.btn-sm {

    font-size: .84rem;

    font-weight: 700;

    border-radius: 10px;

    padding: 11px 13px;

    border: 1.5px solid var(--border);

    background: #ffffff;

    color: var(--ink-soft);

    cursor: pointer;

    text-decoration: none;

    flex: 1;

    text-align: center;

    transition: all .15s ease;
}


/* Complete */

.btn-toggle-complete {

    border-color: #a5b4fc;

    color: var(--primary);

    background: #f5f3ff;
}


.btn-toggle-complete:hover {

    background: var(--primary-light);

    border-color: var(--primary);
}


/* Pending */

.btn-toggle-pending {

    border-color: #fed7aa;

    color: var(--orange);

    background: #fff7ed;
}


.btn-toggle-pending:hover {

    background: #ffedd5;

    border-color: var(--orange);
}


/* Edit */

.btn-edit {

    border-color: #bfdbfe;

    color: var(--blue);

    background: #eff6ff;
}


.btn-edit:hover {

    background: #dbeafe;

    border-color: var(--blue);
}


/* Delete */

.btn-delete {

    border-color: #fecaca;

    color: var(--red);

    background: #fef2f2;
}


.btn-delete:hover {

    background: #fee2e2;

    border-color: var(--red);
}


/* =====================================================
   EMPTY STATE
===================================================== */

.empty-state {

    grid-column: 1/-1;

    color: var(--ink-soft);

    font-size: 1rem;

    font-weight: 600;

    padding: 70px 0;

    text-align: center;

    border: 2px dashed var(--border);

    border-radius: 20px;

    background: #ffffff;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1150px) {

    main {

        padding:
            38px
            35px
            50px;
    }


    #taskList {

        grid-template-columns:
            repeat(
                auto-fit,
                minmax(340px, 1fr)
            );
    }
}


@media(max-width:820px) {

    body {

        flex-direction: column;
    }


    .sidebar {

        width: 100%;

        height: auto;

        position: relative;

        flex-direction: row;

        align-items: center;

        padding: 14px 18px;
    }


    .logo {

        padding: 0;

        margin-right: auto;
    }


    .side-nav {

        flex-direction: row;
    }


    .sidebar-spacer {

        display: none;
    }


    main {

        padding:
            28px
            20px
            40px;
    }


    #taskList {

        grid-template-columns: 1fr;
    }


    .task-card {

        min-height: 320px;
    }
}


@media(max-width:560px) {

    .page-head h1 {

        font-size: 1.85rem;
    }


    .task-card {

        padding: 24px;

        min-height: 300px;

        border-radius: 20px;
    }


    .task-card-head {

        flex-direction: column;

        gap: 12px;
    }


    .task-card-head > div {

        justify-content: flex-start !important;
    }


    .task-title {

        font-size: 1.2rem;
    }


    .task-actions {

        flex-direction: column;
    }


    .btn-sm {

        width: 100%;
    }
}

</style>

</head>


<body>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside class="sidebar">


    <div class="logo">

        <span class="logo-mark">
            TM
        </span>


        <div>

            <div class="logo-name">
                Task Manager
            </div>


            <div class="logo-tag">
                GET IT DONE
            </div>

        </div>

    </div>



    <nav class="side-nav">


        <a href="index.html"
           class="nav-item active">


            <svg width="18"
                 height="18"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <path d="M9 11l3 3L22 4"/>

                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>

            </svg>


            My Tasks


        </a>



        <a href="add.html"
           class="nav-item">


            <svg width="18"
                 height="18"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <circle cx="12"
                        cy="12"
                        r="10"/>

                <line x1="12"
                      y1="8"
                      x2="12"
                      y2="16"/>

                <line x1="8"
                      y1="12"
                      x2="16"
                      y2="12"/>

            </svg>


            Add Task


        </a>


    </nav>



    <div class="sidebar-spacer"></div>



    <button id="logoutBtn"
            class="nav-item logout">


        <svg width="18"
             height="18"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">

            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>

            <polyline points="16 17 21 12 16 7"/>

            <line x1="21"
                  y1="12"
                  x2="9"
                  y2="12"/>

        </svg>


        Logout


    </button>


</aside>



<!-- =====================================================
     MAIN
===================================================== -->

<main>


    <div class="breadcrumb">

        Today /

        <span class="current">
            My tasks
        </span>

    </div>



    <div class="page-head">


        <div>

            <h1>
                My tasks
            </h1>


            <p>
                Everything you're working on, in one place.
            </p>

        </div>



        <a href="add.html"
           class="btn-add">

            + Add Task

        </a>


    </div>



    <div id="alertBox"></div>



    <!-- TASKS -->

    <div id="taskList"></div>


</main>



<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>


<script>

/* =====================================================
   API
===================================================== */

const API_URL =
    "http://localhost:5000/tasks";


const token =
    localStorage.getItem(
        'token'
    );


if (!token) {

    window.location.href =
        "login.html";

}


/* =====================================================
   SOCKET
===================================================== */

const socket =
    io(
        "http://localhost:5000"
    );


socket.on(
    "taskUpdated",
    () => {

        loadTasks();

    }
);


/* =====================================================
   ALERT
===================================================== */

function showAlert(
    message,
    type = "danger"
) {

    document.getElementById(
        'alertBox'
    ).innerHTML =

        `<div class="alert alert-${type}">
            ${message}
        </div>`;

}


/* =====================================================
   PRIORITY
===================================================== */

const priorityPill =
    (priority) => {

        if (!priority)
            return "";


        const colors = {

            high: {

                bg: "#fef2f2",

                c: "#b91c1c",

                border: "#fca5a5"

            },

            medium: {

                bg: "#fff7ed",

                c: "#c2410c",

                border: "#fed7aa"

            },

            low: {

                bg: "#eef2ff",

                c: "#3730a3",

                border: "#c7d2fe"

            }

        };


        const s =
            colors[priority]
            ||
            colors.medium;


        return `

            <span
                class="pill"
                style="
                    background:${s.bg};
                    color:${s.c};
                    border-color:${s.border};
                "
            >

                ${priority.toUpperCase()}

            </span>

        `;

    };


/* =====================================================
   LOAD TASKS
===================================================== */

async function loadTasks() {

    try {

        const response =
            await fetch(
                API_URL,
                {
                    headers: {

                        'Authorization':
                            `Bearer ${token}`

                    }
                }
            );


        if (!response.ok) {

            showAlert(
                "Failed to load tasks. Please login again."
            );

            return;

        }


        const tasks =
            await response.json();


        const list =
            tasks.map(
                task => {


                    let overdue =
                        task.isOverdue

                        ?

                        "<span class='pill' style='background:#fef2f2;color:#b91c1c;border-color:#fca5a5;'>⚠️ Overdue</span>"

                        :

                        "";


                    let priority =
                        priorityPill(
                            task.priority
                        );


                    return `

                        <div class="task-card">


                            <div class="task-card-head">


                                <h3 class="task-title">

                                    ${task.title}

                                </h3>


                                <div
                                    style="
                                        display:flex;
                                        gap:7px;
                                        flex-wrap:wrap;
                                        justify-content:flex-end;
                                    "
                                >

                                    ${priority}

                                    ${overdue}

                                </div>


                            </div>



                            <p class="task-desc">

                                ${task.description || ""}

                            </p>



                            <p class="task-meta">

                                <strong>
                                    Due:
                                </strong>

                                ${
                                    task.dueDate

                                    ?

                                    new Date(
                                        task.dueDate
                                    ).toLocaleDateString()

                                    :

                                    "No due date"
                                }

                            </p>



                            <div
                                class="
                                    status-line
                                    ${
                                        task.completed
                                        ? 'status-done'
                                        : 'status-pending'
                                    }
                                "
                            >

                                <span class="dot"></span>

                                ${
                                    task.completed
                                    ? "Completed"
                                    : "Pending"
                                }

                            </div>



                            <div class="task-actions">


                                <button
                                    class="
                                        btn-sm
                                        ${
                                            task.completed
                                            ? 'btn-toggle-pending'
                                            : 'btn-toggle-complete'
                                        }
                                    "
                                    onclick="
                                        toggleComplete(
                                            '${task._id}',
                                            ${task.completed}
                                        )
                                    "
                                >

                                    ${
                                        task.completed
                                        ? 'Mark Pending'
                                        : 'Mark Complete'
                                    }

                                </button>



                                <a
                                    href="add.html?id=${task._id}"
                                    class="btn-sm btn-edit"
                                >

                                    Edit

                                </a>



                                <button
                                    class="btn-sm btn-delete"
                                    onclick="
                                        deleteTask(
                                            '${task._id}'
                                        )
                                    "
                                >

                                    Delete

                                </button>


                            </div>


                        </div>

                    `;

                }
            )
            .join("");


        document.getElementById(
            'taskList'
        ).innerHTML =

            list

            ||

            "<p class='empty-state'>No tasks yet. Add one above.</p>";


    }

    catch (err) {

        showAlert(
            "Error loading tasks: " +
            err.message
        );

    }

}


/* =====================================================
   TOGGLE COMPLETE
===================================================== */

async function toggleComplete(
    id,
    currentStatus
) {

    try {

        const response =
            await fetch(
                `${API_URL}/${id}`,
                {

                    method: 'PUT',

                    headers: {

                        'Content-Type':
                            'application/json',

                        'Authorization':
                            `Bearer ${token}`

                    },

                    body:
                        JSON.stringify({

                            completed:
                                !currentStatus

                        })

                }
            );


        if (!response.ok) {

            showAlert(
                "Failed to update task status."
            );

            return;

        }


        loadTasks();


    }

    catch (err) {

        showAlert(
            "Error updating task: " +
            err.message
        );

    }

}


/* =====================================================
   DELETE
===================================================== */

async function deleteTask(id) {

    if (
        !confirm(
            "Delete this task?"
        )
    )

        return;


    try {

        const response =
            await fetch(
                `${API_URL}/${id}`,
                {

                    method: 'DELETE',

                    headers: {

                        'Authorization':
                            `Bearer ${token}`

                    }

                }
            );


        if (!response.ok) {

            showAlert(
                "Failed to delete task."
            );

            return;

        }


        loadTasks();


    }

    catch (err) {

        showAlert(
            "Error deleting task: " +
            err.message
        );

    }

}


/* =====================================================
   LOGOUT
===================================================== */

document
    .getElementById(
        'logoutBtn'
    )
    .addEventListener(
        'click',
        () => {

            localStorage.removeItem(
                'token'
            );


            window.location.href =
                "login.html";

        }
    );


/* =====================================================
   INITIAL LOAD
===================================================== */

loadTasks();

</script>


</body>

</html>
