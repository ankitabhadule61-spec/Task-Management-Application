<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Task Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<style>
  <style>
body{
    background:#f4f7fb !important;
}

/* Navbar */
.navbar{
    background:linear-gradient(135deg,#0f172a,#1e293b)!important;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
}

.navbar-brand{
    font-size:1.4rem;
    letter-spacing:0.5px;
}

.navbar-brand i{
    color:#38bdf8;
    margin-left:8px;
    transition:0.3s;
}

.navbar-brand i:hover{
    color:#7dd3fc;
}

/* Page Heading */
h2{
    color:#1e293b;
    font-weight:700;
    text-align:center;
    margin-bottom:25px;
}

/* Register Card */
.card{
    max-width:550px;
    margin:auto;
    border:none;
    border-radius:20px;
    background:white;
    box-shadow:0 10px 30px rgba(0,0,0,0.08)!important;
}

/* Labels */
.form-label{
    font-weight:600;
    color:#334155;
}

/* Inputs */
.form-control{
    border-radius:12px;
    border:1px solid #dbe3ee;
    padding:12px;
}

.form-control:focus{
    border-color:#38bdf8;
    box-shadow:0 0 0 0.2rem rgba(56,189,248,.15);
}

/* Password hint */
.text-muted{
    font-size:0.85rem;
}

/* Register Button */
.btn-primary{
    background:#2563eb;
    border:none;
    border-radius:12px;
    padding:10px;
    font-weight:600;
}

.btn-primary:hover{
    background:#1d4ed8;
}

/* Login Link */
.btn-link{
    text-decoration:none;
    color:#2563eb;
    font-weight:500;
}

.btn-link:hover{
    color:#1d4ed8;
}

/* Alerts */
.alert{
    border-radius:12px;
}

/* Mobile */
@media(max-width:768px){

    .card{
        margin:0 10px;
    }

    h2{
        font-size:1.8rem;
    }
}
</style>
</style>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="index.html">
    Task Manager <i class="bi bi-kanban-fill"></i>
    </a>
  </div>
</nav>


  <!-- Main Container -->
  <div class="container mt-4">
    <h2 class="fw-bold mb-3">Register</h2>

    <form id="registerForm" class="card p-4 shadow-sm">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" id="username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" required>
        <small class="text-muted">Must be 8+ chars, include uppercase, lowercase, number, and special character.</small>
      </div>
      <button type="submit" class="btn btn-primary">Register</button>
      <a href="login.html" class="btn btn-link">Already have an account? Login</a>
    </form>

    <div id="registerResult" class="mt-3"></div>
  </div>

  <script>
    const API_URL = "http://localhost:5000/auth/register";

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });

        const data = await response.json();

        if (response.ok) {
          // ✅ Redirect directly to login page
          window.location.href = "login.html";
        } else {
          if (data.errors && Array.isArray(data.errors)) {
            const messages = data.errors.map(err => `<li>${err.msg}</li>`).join("");
            document.getElementById('registerResult').innerHTML =
              `<div class="alert alert-danger"><ul>${messages}</ul></div>`;
          } else {
            document.getElementById('registerResult').innerHTML =
              `<div class="alert alert-danger">${data.message || "Registration failed"}</div>`;
          }
        }
      } catch (err) {
        document.getElementById('registerResult').innerHTML =
          `<div class="alert alert-danger">Error: ${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
