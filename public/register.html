<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register · Task Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#f8fafc; --bg2:#eef2ff; --card:#ffffff; --border:#cbd5e1;
  --ink:#0f172a; --ink-soft:#475569; --muted:#64748b;
  --primary:#4f46e5; --primary-dark:#3730a3;
  --red:#b91c1c; --red-light:#fef2f2;
  font-family:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; min-height:100vh; background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--ink); display:flex; align-items:center; justify-content:center; padding:24px;
}
.auth-card{
  width:100%; max-width:460px; background:var(--card); border:1.5px solid var(--border);
  border-radius:22px; padding:38px 34px; box-shadow:0 20px 40px rgba(15,23,42,.06);
}
.logo{ display:flex; align-items:center; gap:10px; margin-bottom:30px; }
.logo-mark{
  width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.85rem;
  font-family:'Plus Jakarta Sans',sans-serif;
}
.logo-name{ font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:1.08rem; line-height:1.1; color:var(--ink); }
.logo-tag{ font-size:.62rem; letter-spacing:.09em; color:var(--muted); font-weight:700; }

h2{ font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:1.55rem; margin:0 0 6px; color:var(--ink); }
.sub{ color:var(--ink-soft); font-size:.9rem; margin:0 0 26px; }

.field{ margin-bottom:18px; }
.field label{ display:block; font-size:.8rem; font-weight:700; color:var(--ink); margin-bottom:7px; }
.field input{
  width:100%; font-size:.95rem; color:var(--ink); background:#ffffff;
  border:1.5px solid var(--border); border-radius:11px; padding:12px 14px;
  transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
}
.field input:focus{
  outline:none; border-color:var(--primary); background:#fff;
  box-shadow:0 0 0 4px rgba(79,70,229,.15);
}
.field input::placeholder{ color:var(--muted); }
.field small{ display:block; margin-top:7px; font-size:.78rem; font-weight:500; color:var(--ink-soft); line-height:1.4; }

.btn-submit{
  width:100%; font-size:.95rem; font-weight:700; background:var(--primary); color:#fff;
  border:none; border-radius:11px; padding:13px; cursor:pointer; margin-top:8px;
  transition:background .15s ease, transform .1s ease, box-shadow .15s ease;
  box-shadow:0 10px 22px rgba(79,70,229,.25);
}
.btn-submit:hover{ background:var(--primary-dark); }
.btn-submit:active{ transform:translateY(1px); }

.alt-link{ display:block; text-align:center; margin-top:18px; font-size:.88rem; color:var(--primary); text-decoration:none; font-weight:700; }
.alt-link:hover{ color:var(--primary-dark); }

#registerResult .alert{
  font-size:.88rem; font-weight:600; background:var(--red-light); color:var(--red); border:1px solid #fca5a5;
  border-radius:11px; padding:12px 14px; margin-top:18px;
}
#registerResult .alert ul{ margin:0; padding-left:18px; }
</style>
</head>
<body>

<div class="auth-card">
  <div class="logo">
    <span class="logo-mark">TM</span>
    <div>
      <div class="logo-name">Task Manager</div>
      <div class="logo-tag">GET IT DONE</div>
    </div>
  </div>

  <h2>Create account</h2>
  <p class="sub">Start organizing your work in minutes.</p>

  <form id="registerForm">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="yourname" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required>
      <small>Must be 8+ chars, include uppercase, lowercase, number, and special character.</small>
    </div>
    <button type="submit" class="btn-submit">Register</button>
    <a href="login.html" class="alt-link">Already have an account? Login</a>
  </form>

  <div id="registerResult"></div>
</div>

<script>
  const API_URL = "http://localhost:5000/auth/register";

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });

      const data = await response.json();

      if (response.ok) {
        window.location.href = "login.html";
      } else {
        if (data.errors && Array.isArray(data.errors)) {
          const messages = data.errors.map(err => `<li>${err.msg}</li>`).join("");
          document.getElementById('registerResult').innerHTML =
            `<div class="alert alert-danger"><ul>${messages}</ul></div>`;
        } else {
          document.getElementById('registerResult').innerHTML =
            `<div class="alert alert-danger">${data.message || "Registration failed"}</div>`;
        }
      }
    } catch (err) {
      document.getElementById('registerResult').innerHTML =
        `<div class="alert alert-danger">Error: ${err.message}</div>`;
    }
  });
</script>

</body>
</html>
